<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>trygga</title>
  </head>
  <body>
    <p id="display-mode"></p>
    <p id="last-tick"></p>
    <script>
      // A test page: once a minute it writes the time into its title, which the app copies to the
      // bar. The gap between ticks also goes to the probe scheme, a second road that does not pass
      // through the title, so a page that stopped and a title that stopped read differently.
      const TICK_MS = 60_000;
      const displayMode = matchMedia("(display-mode: standalone)").matches
        ? "standalone"
        : "not-standalone";
      document.getElementById("display-mode").textContent = `display-mode: ${displayMode}`;

      let tick = 0;
      let lastTickAt = Date.now();

      function writeTick() {
        const now = new Date();
        const gapMs = now.getTime() - lastTickAt;
        lastTickAt = now.getTime();
        tick += 1;

        const clock = `${now.getHours()}:${String(now.getMinutes()).padStart(2, "0")}`;
        const line =
          `tick=${tick} gap_ms=${gapMs} display_mode=${displayMode} ` +
          `visibility=${document.visibilityState}`;
        document.title = `${clock} ${line}`;
        document.getElementById("last-tick").textContent = line;
        fetch(`probe://localhost/tick?${encodeURIComponent(line)}`, { mode: "no-cors" }).catch(
          () => {},
        );
      }

      writeTick();
      setInterval(writeTick, TICK_MS);
    </script>
  </body>
</html>
